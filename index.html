.flex{display:flex;gap:8px}.flex>*{flex:1}

.srow .nm{flex:1;min-width:0;border:none;background:none;text-align:right;padding:0;color:inherit}

.srow .nm span{font-size:11.5px;color:var(--muted)}
.rd{color:var(--red);font-weight:700}.bl{color:var(--blue);font-weight:700}.gr{color:var(--green);font-weight:700}
.pres{flex:none;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px;color:var(--muted);min-width:78px}

.pays{display:flex;gap:5px;margin-top:7px}

.pays button.on{background:var(--yellow);border-color:var(--yellow)}
.pays button.x.on{background:#fde8ea;border-color:#f6c3c8;color:var(--red)}
.other{display:flex;gap:6px;margin-top:6px}.other input{flex:1;min-width:0}
/* list */
.row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:9px 10px;margin-bottom:7px;border:none;width:100%;text-align:right;color:inherit;font-size:15px;box-shadow:0 1px 2px rgba(11,31,75,.06)}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm span{font-size:12px;color:var(--muted)}
.kpi{display:flex;flex-direction:column;align-items:center;flex:none;min-width:34px;line-height:1.1}
.kpi b{font-size:16px;color:var(--navy)}.kpi i{font-style:normal;font-size:10px;color:var(--muted)}.kpi.m b{color:var(--green);font-size:14px}
.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:20px;flex:none;white-space:nowrap}
.badge.ok{background:#e3f6eb;color:var(--green)}.badge.no{background:#fde8ea;color:var(--red)}.badge.pre{background:#e6f0fb;color:var(--blue)}.badge.nw{background:#eef1f8;color:var(--muted)}
.sum{font-size:13px;color:var(--navy);background:#e9edf7;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-weight:600}
.hist{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:7px;border:none;width:100%;text-align:right;color:inherit}
.hist .d{background:var(--navy);color:#fff;border-radius:10px;padding:4px 8px;text-align:center;font-weight:800;line-height:1.1;flex:none}.hist .d small{display:block;font-size:10px;color:var(--yellow);font-weight:600}
.hist .t{flex:1}.hist .t b{display:block}.hist .t span{font-size:12px;color:var(--muted)}
/* nav, sheets */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:8px 0 7px;font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}nav button.on{color:var(--navy)}nav button.on svg{stroke:var(--navy)}
.fab{position:fixed;bottom:76px;left:16px;width:54px;height:54px;border-radius:50%;background:var(--yellow);color:var(--navy);border:none;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.ov{position:fixed;inset:0;background:rgba(11,31,75,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}

.sheet h3{margin:0 0 12px;color:var(--navy);font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-right:auto;background:none;border:none;font-size:26px;color:var(--muted)}
.sheet h4{margin:16px 2px 8px;color:var(--navy);font-size:15px}
.seg{display:flex;background:#e3e7f0;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:7px;font-weight:700;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center}
.seg button small{font-weight:600;font-size:11px}.seg button.on{background:var(--navy);color:#fff}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pitem{border:none;background:#e3f6eb;color:var(--green);border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center;font-size:13px}
.pitem span{color:var(--muted)}.pitem i{font-style:normal;color:var(--red);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:none;border-radius:8px;background:var(--navy);color:#fff;text-align:center;padding:5px 2px;font-size:12px;font-weight:700;font-family:inherit}
.slot small{display:block;font-size:10px;opacity:.7}

.cardsimg{width:100%;border-radius:8px;margin-bottom:8px;background:#fff}

.toast.bad{background:var(--red)}.toast.good{background:var(--green)}
textarea.inp{min-height:110px}

.oldrow{background:#fff;border-radius:10px;padding:6px;margin-bottom:5px}

.hist small{font-size:10px;color:var(--muted)}

#sugg{margin-bottom:4px}
.cam-ov{position:fixed;inset:0;background:#000;z-index:40}
.cam-ov video{width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border:4px solid var(--yellow);border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}

.cam-top{top:env(safe-area-inset-top)}.cam-bot{bottom:calc(10px + env(safe-area-inset-bottom))}
.cam-top .x{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%}
.cam-bot button{background:var(--yellow);color:var(--navy);border:none;border-radius:12px;padding:10px 14px;font-weight:800;font-family:inherit}
.cam-bot label{display:flex;gap:6px;align-items:center}
#lock{position:fixed;inset:0;background:var(--navy);z-index:50;display:flex;align-items:center;justify-content:center;color:#fff}
.lk{text-align:center;width:280px}.lk b{font-size:20px;color:var(--yellow)}.lk p{margin:6px 0 14px;opacity:.8}
.lk .dots{display:flex;gap:10px;justify-content:center;height:18px;margin-bottom:18px}.lk .dots i{width:14px;height:14px;border-radius:50%;background:var(--yellow)}
.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pad button{height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:24px;font-weight:700;font-family:inherit}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>

			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

   list.forEach(function(s){var n=dates.filter(function(d){return M[s.id][d]}).length+((s.sessions||[]).filter(function(d){return dates.indexOf(d)<0}).length);
    var f=info(Object.assign({},s,{sessions:Object.keys(M[s.id]),oldPaid:P[s.id],oldN:0}));
    h+='<tr><td class="sn" data-row="'+s.id+'"><b>'+s.no+'</b> '+esc(s.name)+'</td>';dates.forEach(function(d){h+='<td class="c'+(M[s.id][d]?' on':'')+'" data-c="'+s.id+'|'+d+'">'+(M[s.id][d]?'✓':'')+'</td>'});
    h+='<td><input class="gp" data-p="'+s.id+'" inputmode="numeric" value="'+(P[s.id]||'')+'" placeholder="0"></td><td class="gb '+(f.bal<0?'rd':f.bal>0?'bl':'gr')+'">'+(f.bal<0?'-'+(-f.bal):f.bal>0?'+'+f.bal:'0')+'<small>'+f.n+' ح</small></td></tr>'});
   h+='</tbody></table></div>'}
  h+='<div class="flex" style="margin-top:10px"><button class="btn y" id="gsave">حفظ</button><button class="btn o" id="gcancel" style="flex:0 0 auto">إلغاء</button></div>';
  var sc=o.querySelector('.gwrap'),sl=sc?sc.scrollLeft:null,st=o.querySelector('.sheet').scrollTop;o.querySelector('.sheet').innerHTML=h;if(sl!==null&&o.querySelector('.gwrap'))o.querySelector('.gwrap').scrollLeft=sl;o.querySelector('.sheet').scrollTop=st;
  o.querySelectorAll('.gp').forEach(function(i){i.oninput=function(){P[i.getAttribute('data-p')]=parseInt(i.value,10)||0};i.onchange=function(){draw()}})}
 draw();
 function close(){o.remove()}
 o.onclick=function(e){if(e.target===o||e.target.classList.contains('x')||e.target.id==='gcancel'){close();return}
  var c=e.target.closest('[data-c]');if(c){var k=c.getAttribute('data-c').split('|');if(M[k[0]][k[1]])delete M[k[0]][k[1]];else M[k[0]][k[1]]=1;draw();return}
  var col=e.target.closest('[data-col]');if(col){var d=col.getAttribute('data-col'),all=list.every(function(s){return M[s.id][d]});list.forEach(function(s){if(all)delete M[s.id][d];else M[s.id][d]=1});draw();return}
  var r=e.target.closest('[data-row]');if(r){var id=r.getAttribute('data-row'),allr=dates.every(function(d){return M[id][d]});dates.forEach(function(d){if(allr)delete M[id][d];else M[id][d]=1});draw();return}
  if(e.target.id==='gsave'){var n=0;list.forEach(function(s){var ns=Object.keys(M[s.id]).sort(),old=(s.sessions||[]).slice().sort();if(ns.join()!==old.join()||(s.oldPaid||0)!==P[s.id]){s.sessions=ns;s.oldPaid=P[s.id];s.oldN=0;saveS(s);n++}});close();render();toast('تسجّل الدفتر لـ'+n+' تلميذ ✓','good')}}}

/* ======== QR ======== */
function loadScript(src,test){return new Promise(function(res){if(test())return res(true);var s=document.createElement('script');s.src=src;s.onload=function(){res(test())};s.onerror=function(){res(false)};document.head.appendChild(s)})}
function qrLib(){return Promise.resolve(typeof QRLIB==='function')}
function qrMatrix(text){var q=new QRLIB(-1,0);q.addData(text);q.make();var n=q.getModuleCount(),m=[];for(var r=0;r<n;r++){m.push([]);for(var c=0;c<n;c++)m[r].push(q.isDark(r,c))}return m}
function codeText(no){return 'C20-'+no}
function paintQR(ctx,x,y,size,no){var m=qrMatrix(codeText(no)),n=m.length,cell=size/(n+2);ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);ctx.fillStyle='#0b1f4b';for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(m[r][c])ctx.fillRect(Math.floor(x+(c+1)*cell),Math.floor(y+(r+1)*cell),Math.ceil(cell),Math.ceil(cell))}
function drawQR(cv,no){if(!cv)return;qrLib().then(function(ok){var ctx=cv.getContext('2d');if(!ok){ctx.fillStyle='#fff';ctx.fillRect(0,0,200,200);ctx.fillStyle='#0b1f4b';ctx.font='bold 90px Cairo';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(no,100,105);return}paintQR(ctx,0,0,200,no)})}
function makeCards(list,gname){return qrLib().then(function(ok){return (document.fonts?document.fonts.load('700 40px Cairo'):Promise.resolve()).then(function(){
 var pages=[],per=10,W=1240,H=1754,cw=560,ch=310,mx=40,my=40,gx=40,gy=26;
 for(var p=0;p<list.length;p+=per){var cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  list.slice(p,p+per).forEach(function(s,i){var c=i%2,r=Math.floor(i/2),X=mx+c*(cw+gx),Y=my+r*(ch+gy);
   drawCard(x,X,Y,cw,ch,s,ok,gname);
   x.strokeStyle='#ccc';x.setLineDash([8,8]);x.lineWidth=2;x.strokeRect(X-10,Y-10,cw+20,ch+20);x.setLineDash([])});
  pages.push(cv.toDataURL('image/png'))}
 return pages})})}
function drawCard(x,X,Y,cw,ch,s,ok,gname){x.fillStyle='#0b1f4b';roundRect(x,X,Y,cw,ch,24);x.fill();x.fillStyle='#f5c518';x.fillRect(X+cw-14,Y+30,6,ch-60);
 if(ok)paintQR(x,X+24,Y+35,240,s.no);else{x.fillStyle='#fff';x.fillRect(X+24,Y+35,240,240)}
 x.textAlign='right';x.direction='rtl';x.fillStyle='#f5c518';x.font='800 96px Cairo';x.fillText(String(s.no),X+cw-40,Y+120);
 x.fillStyle='#fff';var fs=34;x.font='700 '+fs+'px Cairo';while(x.measureText(s.name).width>cw-310&&fs>22){fs-=2;x.font='700 '+fs+'px Cairo'}wrapText(x,s.name,X+cw-40,Y+180,cw-310,fs+4);
 x.fillStyle='rgba(255,255,255,.65)';x.font='600 22px Cairo';x.fillText(gname||grp(s.groupId).name,X+cw-40,Y+ch-60);
 x.fillStyle='#f5c518';x.font='800 24px Cairo';x.fillText('compta__20',X+cw-40,Y+ch-26)}
function makeOne(s){return qrLib().then(function(ok){return (document.fonts?document.fonts.load('700 40px Cairo'):Promise.resolve()).then(function(){var cv=document.createElement('canvas');cv.width=600;cv.height=340;var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,600,340);drawCard(x,15,15,570,310,s,ok);return cv.toDataURL('image/png')})})}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrapText(x,t,X,Y,maxW,lh){var w=t.split(' '),line='',n=0;for(var i=0;i<w.length;i++){var test=line?line+' '+w[i]:w[i];if(x.measureText(test).width>maxW&&line){x.fillText(line,X,Y+n*lh);n++;line=w[i]}else line=test}x.fillText(line,X,Y+n*lh)}
function openCards(){var list=filtered();if(!list.length){toast('ما كاش تلاميذ');return}
 sheet('<h3>بطاقات الكود ('+list.length+')<button class="x">×</button></h3><p class="hint">اضغط مطوّلاً على الصورة ← «حفظ الصورة»، ومن بعد اطبعها وقصّ البطاقات. كل ورقة A4 فيها 10 بطاقات.</p><div id="cardsBox" class="empty">جاري التحضير…</div>',function(o){makeCards(list,ui.g!=='all'?grp(ui.g).name:'').then(function(pages){o.querySelector('#cardsBox').className='';o.querySelector('#cardsBox').innerHTML=pages.map(function(u,i){return '<p class="hint">الورقة '+(i+1)+'</p><img class="cardsimg" src="'+u+'">'}).join('')})})}

/* ======== camera scan ======== */
var camIn=document.getElementById('camIn');
camIn.onchange=function(){var f=camIn.files&&camIn.files[0];camIn.value='';if(!f)return;toast('جاري القراءة…');decodeImage(f).then(function(t){if(t)handleCode(t);else toast('ما قريتش الكود — قرّب الكاميرا ولا اكتب الرقم','bad')})};
function decodeImage(file){return new Promise(function(res){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){
 var tryNative=('BarcodeDetector' in window)?new window.BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13']}).detect(img).then(function(r){return r&&r[0]&&r[0].rawValue}).catch(function(){return null}):Promise.resolve(null);
 tryNative.then(function(v){if(v){URL.revokeObjectURL(url);return res(v)}
  loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',function(){return typeof window.jsQR==='function'}).then(function(ok){if(!ok){URL.revokeObjectURL(url);return res(null)}
   var sc=Math.min(1,1000/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);var x=cv.getContext('2d');x.drawImage(img,0,0,cv.width,cv.height);
   var d=x.getImageData(0,0,cv.width,cv.height),r=window.jsQR(d.data,cv.width,cv.height);URL.revokeObjectURL(url);res(r&&r.data)})})};
 img.onerror=function(){res(null)};img.src=url})}

/* ======== PIN ======== */
function pinHash(){try{return localStorage.getItem(KEY+'_pin')||''}catch(e){return ''}}
function hashPin(p){var h=5381;p='c20:'+p+':pino';for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))>>>0;return 'h'+h.toString(36)}
function setPin(){sheet('<h3>🔒 الكود السري<button class="x">×</button></h3><p class="hint">4 أرقام ولا كثر. يطلبو كل ما تفتح التطبيق.</p><input id="p1" class="inp" type="password" inputmode="numeric" placeholder="الكود الجديد" style="margin-bottom:8px"><input id="p2" class="inp" type="password" inputmode="numeric" placeholder="عاود الكود"><button class="btn y full" id="pok" style="margin-top:12px">حفظ</button>',function(o,close){o.querySelector('#pok').onclick=function(){var a=o.querySelector('#p1').value,b=o.querySelector('#p2').value;if(!/^\d{4,8}$/.test(a)){toast('لازم 4 أرقام على الأقل','bad');return}if(a!==b){toast('الكودين ماشي كيف كيف','bad');return}try{localStorage.setItem(KEY+'_pin',hashPin(a))}catch(e){}close();render();toast('✓ الكود السري تحفظ','good')}})}
var locked=false,hiddenAt=0;
function lock(){if(!pinHash()||locked)return;locked=true;var o=document.createElement('div');o.id='lock';o.innerHTML='<div class="lk"><div class="logo" style="margin:0 auto 10px;width:56px;height:56px">'+LOGO+'</div><b>compta__20</b><p>اكتب الكود السري</p><div class="dots" id="ldots"></div><div class="pad">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function(k){return k===''?'<span></span>':'<button data-k="'+k+'">'+k+'</button>'}).join('')+'</div></div>';document.body.appendChild(o);var v='';
 function dots(){o.querySelector('#ldots').innerHTML=v.split('').map(function(){return '<i></i>'}).join('')||'&nbsp;'}dots();
 o.onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.getAttribute('data-k');if(k==='⌫')v=v.slice(0,-1);else if(v.length<8)v+=k;dots();
  if(v.length>=4&&hashPin(v)===pinHash()){o.remove();locked=false}else if(v.length>=8){v='';dots();o.querySelector('.lk').classList.add('shake');setTimeout(function(){o.querySelector('.lk').classList.remove('shake')},400)}}}
document.addEventListener('visibilitychange',function(){if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>120000)lock()});
lock();

/* ======== live camera scan ======== */
var camCont=true;
function decoder(){if('BarcodeDetector' in window){try{var bd=new window.BarcodeDetector({formats:['qr_code']});return Promise.resolve(function(c){return bd.detect(c).then(function(r){return r&&r[0]&&r[0].rawValue}).catch(function(){return null})})}catch(e){}}
 return loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',function(){return typeof window.jsQR==='function'}).then(function(ok){if(!ok)return null;return function(c){var x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),r=window.jsQR(d.data,c.width,c.height,{inversionAttempts:'dontInvert'});return Promise.resolve(r&&r.data)}})}
function openCam(){if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){scanSrc='cam';camIn.click();return}
 var o=document.createElement('div');o.className='cam-ov';o.innerHTML='<video playsinline autoplay muted></video><div class="cam-frame"></div><div class="cam-top"><span>وجّه الكاميرا للكود QR</span><button class="x">×</button></div><div class="cam-bot"><label><input type="checkbox" id="ccont"'+(camCont?' checked':'')+'> مسح متواصل</label><button data-k="type">⌨️ اكتب الرقم</button></div>';document.body.appendChild(o);
 var video=o.querySelector('video'),stream=null,stop=false,cv=document.createElement('canvas');
 o.querySelector('#ccont').onchange=function(){camCont=this.checked};
 function end(){stop=true;if(stream)stream.getTracks().forEach(function(t){t.stop()});o.remove()}
 o.onclick=function(e){if(e.target.classList.contains('x')){end();scanSrc='key'}if(e.target.getAttribute('data-k')==='type'){end();scanSrc='key';var sc=document.getElementById('scan');if(sc)sc.focus()}};
 Promise.all([navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}),decoder()]).then(function(r){stream=r[0];var dec=r[1];if(stop){end();return}video.srcObject=stream;video.play().catch(function(){});
  if(!dec){toast('القارئ ما تحمّلش — يحتاج أنترنت أول مرة','bad');return}
  (function tick(){if(stop)return;if(video.readyState>=2&&video.videoWidth){var w=video.videoWidth,hh=video.videoHeight,sc=Math.min(1,720/Math.max(w,hh));cv.width=Math.round(w*sc);cv.height=Math.round(hh*sc);cv.getContext('2d').drawImage(video,0,0,cv.width,cv.height);
    dec(cv).then(function(t){if(stop)return;if(t&&/(#n|C20-)?\d+/i.test(t)){try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}end();scanSrc='live';handleCode(/^\d+$/.test(t)?'#n'+t:t)}else setTimeout(tick,180)})}else setTimeout(tick,150)})()},
 function(err){end();toast('ما قدرتش نفتح الكاميرا — اسمح بالكاميرا في الإعدادات','bad')})}

/* ======== actions ======== */
document.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-act]');if(!b||b.closest('.ov'))return;
 var gv=b.getAttribute('data-go');if(gv){go(gv);return}
 var a=b.getAttribute('data-act'),id=b.getAttribute('data-id'),s=id&&ST[id];
 if(a==='pres'&&s){togglePres(s);render()}
 else if(a==='pay'&&s){setPay(s,+b.getAttribute('data-v'));if(ui.other===id)ui.other=null;render()}
 else if(a==='other'){ui.other=ui.other===id?null:id;render()}
 else if(a==='otherOk')otherOk();
 else if(a==='otherNo'){ui.other=null;render()}
 else if(a==='pickSug'){var sc2=document.getElementById('scan');if(sc2)sc2.value='';scanSrc='tap';handleCode('#n'+id);drawSugg('')}

 else if(a==='oldBulk')openOld(ui.attG||(groups()[0]&&groups()[0].id));
 else if(a==='copyList'){var l=filtered(),t='📋 قائمة التلاميذ'+(ui.g!=='all'?' - '+grp(ui.g).name:'')+'\n\n';l.forEach(function(s){var f=info(s);t+=s.no+'. '+s.name+' — '+f.n+' حصة — خلّص '+f.paid+' دج'+(f.bal<0?' — ❌ باقي '+(-f.bal):f.bal>0?' — رصيد +'+f.bal:'')+'\n'});copy(t)}
 else if(a==='newG')editG(null);
 else if(a==='editG'){e.preventDefault();editG(id)}
 else if(a==='doBackup')doBackup();

 else if(a==='setPin')setPin();

 else if(a==='camLive'){scanSrc='cam';openCam()}
 else if(a==='restore'){sheet('<h3>استرجاع نسخة<button class="x">×</button></h3><p class="hint">الصق البيانات اللي نسختها. التلاميذ اللي عندهم نفس المعرّف يتبدلو.</p><textarea id="rj" class="inp" style="direction:ltr;font-size:12px"></textarea><div style="margin-top:12px"><button class="btn y full" id="rok">استرجاع</button></div>',function(o,close){o.querySelector('#rok').onclick=function(){try{var d=JSON.parse(o.querySelector('#rj').value);if(!d.groups||!d.students)throw 0;d.groups.forEach(saveG);d.students.forEach(saveS);close();render();toast('ترجعو البيانات ✓','good')}catch(x){toast('النص ماشي صحيح','bad')}}})}
});
window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1),mm=h.match(/^n(\d+)$/);if(mm){pendingScan=+mm[1];if(loaded.g&&loaded.s)runPending();return}if(['today','students','history','manage'].indexOf(h)>=0&&h!==ui.view){ui.view=h;render()}});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
})();
